<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conferência de NF-e — Just Burger</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
  header { background: #1f2937; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  main { padding: 24px; max-width: 1280px; margin: 0 auto; }
  .oculto { display: none; }
  .cartao { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 20px; }
  input[type=email], input[type=password] { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { background: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1d4ed8; }
  button.sec { background: #6b7280; } button.sec:hover { background: #4b5563; }
  button.destaque { background: #059669; } button.destaque:hover { background: #047857; }
  button:disabled { opacity: .5; cursor: default; }
  #login-erro { color: #dc2626; font-size: 14px; }
  #input-xml { margin-bottom: 8px; }
  .barra { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .barra h3 { margin: 0; flex: 1; }
  .barra select { padding: 7px; border-radius: 6px; border: 1px solid #ccc; }

  details.nota { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; background: #fff; }
  details.nota[open] { border-color: #9ca3af; }
  details.nota > summary { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; cursor: pointer; list-style: none; }
  details.nota > summary::-webkit-details-marker { display: none; }
  details.nota > summary::before { content: "▸"; color: #6b7280; }
  details.nota[open] > summary::before { content: "▾"; }
  .nota-titulo { flex: 1 1 280px; }
  .nota-meta { color: #6b7280; font-size: 13px; }
  .acoes { display: flex; gap: 6px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 99px; }
  .badge.pendente { background: #fef3c7; color: #92400e; }
  .badge.revisada { background: #d1fae5; color: #065f46; }

  .tabela-itens { overflow-x: auto; padding: 0 14px 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  th { background: #f3f4f6; }
  td.desc { min-width: 260px; }
  td small { display: block; color: #6b7280; font-size: 12px; margin-top: 2px; }
  td select, td input { padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  td input { width: 52px; }
  td input.invalido { border-color: #dc2626; background: #fef2f2; }
  tr.sugestao { background: #fffbeb; }
  tr.sem-class { background: #fef2f2; }
  .selo { font-size: 12px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .selo.ok { background: #d1fae5; color: #065f46; }
  .selo.cad { background: #dbeafe; color: #1e40af; }
  .selo.man { background: #ede9fe; color: #5b21b6; }
  .selo.sug { background: #fef3c7; color: #92400e; }
  #paginacao { display: flex; gap: 14px; align-items: center; justify-content: center; margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h2>Conferência de NF-e — Just Burger</h2>
  <div id="user-info" class="oculto">
    <span id="usuario-label" style="margin-right:12px;"></span>
    <button id="btn-sair" class="sec">Sair</button>
  </div>
</header>

<main>
  <section id="login-view" class="cartao">
    <h3>Entrar</h3>
    <form id="login-form">
      <label>E-mail</label>
      <input type="email" id="login-email" required />
      <label>Senha</label>
      <input type="password" id="login-senha" required />
      <button type="submit">Entrar</button>
      <p id="login-erro"></p>
    </form>
  </section>

  <section id="app-view" class="oculto">
    <div class="cartao">
      <h3>Enviar XML(s) de notas de entrada</h3>
      <input type="file" id="input-xml" accept=".xml" multiple />
      <p id="status-import" style="color:#666; font-size:13px; margin:0 0 6px;"></p>
      <p style="color:#666; font-size:13px; margin:0;">
        Cada item é classificado (produtos já revisados vêm do cadastro), com CFOP e CST de
        PIS/COFINS de entrada sugeridos. Abra a nota, ajuste o que precisar e salve a revisão.
      </p>
    </div>

    <div class="cartao">
      <div class="barra">
        <h3>Notas</h3>
        <select id="filtro-status">
          <option value="todas">Todas</option>
          <option value="pendente">Pendentes</option>
          <option value="revisada">Revisadas</option>
        </select>
        <button id="btn-pdf-pagina" class="sec">PDF da página</button>
      </div>
      <div id="lista-notas"></div>
      <div id="paginacao"></div>
    </div>
  </section>
</main>

<datalist id="lista-cst"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
